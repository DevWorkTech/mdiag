# Опциональный HTTP-вариант для изолированной LAN, вместо HTTPS-конфига/redirect 80.
# Передаёт пароль без TLS; не публикуйте этот virtual host в Интернет.
server {
    listen 80;
    server_name diag.devwork.ru;
    if ($host != diag.devwork.ru) { return 444; }
    root /var/www/my-project/public;
    index index.php;
    charset utf-8;
    client_max_body_size 1m;
    send_timeout 300s;
    access_log /var/log/nginx/mdiag-access.log mdiag_safe;
    error_log /var/log/nginx/mdiag-error.log warn;
    # Официальные .php пути — виртуальные Laravel routes, не файлы на диске.
    # Каждый профиль всегда идёт через front controller, включая .zip и .php.
    location ~ ^/(xdiag|xpro5|xpro7|diagzone|prodiag)(/|$) { rewrite ^ /index.php last; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS off;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }
    location ~ /\. { deny all; }
    # Запрещаем другие физические PHP-файлы, оставляя виртуальные API Laravel.
    location ~ \.php$ { rewrite ^ /index.php last; }
    add_header X-Content-Type-Options nosniff always;
}

