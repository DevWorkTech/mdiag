# Домен должен совпадать с config/mdiag-dwt.php и доменом сборки APK.
server {
    listen 80;
    server_name diag.devwork.local;
    if ($host != diag.devwork.local) { return 444; }
    return 308 https://diag.devwork.local$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name diag.devwork.local;
    if ($host != diag.devwork.local) { return 444; }
    ssl_certificate /etc/nginx/mdiag-tls/diag.devwork.local.crt;
    ssl_certificate_key /etc/nginx/mdiag-tls/diag.devwork.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/my-project/public;
    index index.php;
    charset utf-8;
    client_max_body_size 1m;
    send_timeout 300s;
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.88.0/24;
    deny all;
    access_log /var/log/nginx/mdiag-access.log mdiag_safe;
    error_log /var/log/nginx/mdiag-error.log warn;
    # Официальные .php пути — виртуальные Laravel routes, не файлы на диске.
    # Каждый профиль всегда идёт через front controller, включая .zip и .php.
    location ~ ^/(xdiag|xpro5|xpro7|diagzone|prodiag)(/|$) { rewrite ^ /index.php last; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }
    location ~ /\. { deny all; }
    # Запрещаем другие физические PHP-файлы, оставляя виртуальные API Laravel.
    location ~ \.php$ { rewrite ^ /index.php last; }
    add_header X-Content-Type-Options nosniff always;
}
